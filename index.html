<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css"> 

  
</head>
<body>
  <main><!-- main marca o conteudo principal do site -->
    <article class="card"><!-- article é usado para marcar conteudos independentes,
                          // como posts de blog, noticias, etc -->
        <img class="card__imagem" src="./assets/images/illustration-article.svg" alt="Ilustração de um artigo de blog">


      <div class="card__conteudo"><!-- pode agrupar o texto --> 
        <span class="card__categoria">Learning</span>
        <time datetime="2023-12-21" >Published 21 Dec 2023</time>
        <h1>HTML & CSS foundations</h1>
        <p >These languages are the backbone of every website, defining structure, content, and presentation.</p>
        <div class="card__autor">
          <img src="./assets/images/image-avatar.webp" alt="Avatar de Greg Hooper">
          <span >Greg Hooper</span>
        </div>
      </div>

    
    </article>

  </main>
  
  
  <footer class="attribution">
   
  </footer>
</body>
</html>
